name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Unit Tests
        working-directory: cli
        run: go test -v ./...

      - name: Build & Package Binaries
        env:
          TAG_NAME: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w \
            -X 'github.com/burakberk/lubelogger-cli/internal/version.Version=${TAG_NAME}' \
            -X 'github.com/burakberk/lubelogger-cli/internal/version.Commit=${GIT_COMMIT}' \
            -X 'github.com/burakberk/lubelogger-cli/internal/version.Date=${BUILD_DATE}'"

          mkdir -p dist

          # Build matrix: OS/ARCH
          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/arm64"
          )

          cd cli
          for TARGET in "${TARGETS[@]}"; do
            GOOS="${TARGET%%/*}"
            GOARCH="${TARGET##*/}"
            RAW_BINARY_NAME="lubelog-${GOOS}-${GOARCH}"
            ARCHIVE_NAME="lubelog_${TAG_NAME}_${GOOS}_${GOARCH}.tar.gz"

            echo "==> Building for ${GOOS}/${GOARCH}..."
            mkdir -p "${BIN_DIR}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BIN_DIR}/lubelog" ./cmd/lubelog

            echo "==> Packaging ${RAW_BINARY_NAME} & ${ARCHIVE_NAME}..."
            cp "${BIN_DIR}/lubelog" "../dist/${RAW_BINARY_NAME}"
            tar -czf "../dist/${ARCHIVE_NAME}" -C "${BIN_DIR}" lubelog
          done
          cd ..

          echo "==> Generating sha256 checksums..."
          cd dist
          sha256sum * > checksums.txt 2>/dev/null || shasum -a 256 * > checksums.txt
          cat checksums.txt
          cd ..

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "Release ${TAG_NAME}" \
            --generate-notes \
            dist/lubelog-* dist/*.tar.gz dist/checksums.txt
